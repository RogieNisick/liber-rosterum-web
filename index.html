<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Liber Rosterum</title>
<!-- С главного экрана — как отдельное приложение, без панелей Safari -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liber Rosterum">
<meta name="theme-color" content="#0A0908">
<style>
  /* Страница закреплена на экране: iOS Safari иначе прокручивает её и сдвигает меню вверх */
  html, body { margin: 0; width: 100%; height: 100%; position: fixed; inset: 0; background: #0A0908; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  /* Холст тоже закреплён: без этого на iPhone он уезжает вверх под системную строку */
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<input id="lrin" type="text" autocomplete="off" autocorrect="off" style="position:fixed;display:none;z-index:5;box-sizing:border-box;margin:0;border:1px solid #C9A55A;background:#F1E4C2;color:#2B1E12;font:18px sans-serif;padding:6px 10px;outline:none;">
<textarea id="lrta" autocomplete="off" style="position:fixed;display:none;z-index:5;box-sizing:border-box;margin:0;border:1px solid #C9A55A;background:#F1E4C2;color:#2B1E12;font:18px sans-serif;padding:6px 10px;outline:none;resize:none;"></textarea>
<script>
  // Безопасная зона (вырез, системная строка, полоса индикатора): меню сдвигается внутрь (см. lrshim.Shell)
  window.LRINSET = { top: 0, right: 0, bottom: 0, left: 0 };
  (function () {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
      'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);';
    document.body.appendChild(probe);
    function measureInsets() {
      var cs = getComputedStyle(probe);
      window.LRINSET = {
        top: parseFloat(cs.paddingTop) || 0,
        right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0,
        left: parseFloat(cs.paddingLeft) || 0
      };
    }
    measureInsets();
    window.addEventListener('resize', measureInsets);
    window.addEventListener('orientationchange', measureInsets);
  })();
  // Поле ввода подложки: нативный input на месте поля в канвасе (см. android.widget.EditText)
  window.lrEdit = function (x, y, w, h, value, hint, onText, onDone, multi) {
    var el = document.getElementById(multi ? 'lrta' : 'lrin');
    el.style.display = 'block';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    el.style.height = (multi ? Math.max(h, 96) : h) + 'px';
    el.value = value;
    el.placeholder = hint;
    el.oninput = function () { onText(el.value); };
    el.onkeydown = function (e) { if (e.key === (multi ? 'Escape' : 'Enter')) el.blur(); };
    el.onblur = function () {
      el.style.display = 'none';
      el.oninput = el.onblur = el.onkeydown = null;
      onDone();
    };
    el.focus();
  };
</script>
<div id="boot" style="position:fixed;left:0;right:0;top:45%;text-align:center;color:#C9A55A;font:16px sans-serif;padding:0 16px;">Загрузка…</div>
<script src="js/assets.js"></script>
<script src="js/books.js"></script>
<script src="js/photos.js"></script>
<script src="js/feeds.js"></script>
<script src="js/heraldmap.js"></script>
<script src="js/herald.js"></script>
<script src="js/engine.js"></script>
<script src="js/bsdata.js"></script>
<script>
(function () {
  // Подложка android.* рисует на этом холсте (см. full/NOTES.md)
  window.LRCANVAS = document.getElementById('c');
  window.LRIMG = {};
  // TeaVM без модулей: main — функция движка; она регистрирует запуск (lrStart)
  if (typeof main === 'function') main([]);

  // Шрифты из Android-ассетов под семействами, которые ждёт android.graphics.Typeface
  var fonts = [
    ['LRCinzel900', 'fonts/Cinzel-900.ttf'],
    ['LRCinzel700', 'fonts/Cinzel-700.ttf'],
    ['LRCormorant', 'fonts/CormorantSC-Bold.ttf'],
    ['LRPTBold', 'fonts/PT_Sans-Narrow-Web-Bold.ttf'],
    ['LRPTRegular', 'fonts/PT_Sans-Narrow-Web-Regular.ttf']
  ];
  var waits = fonts.map(function (f) {
    var ff = new FontFace(f[0], 'url(' + f[1] + ')');
    document.fonts.add(ff);
    return ff.load().catch(function () { });
  });
  // Картинки грузим заранее: android.graphics.BitmapFactory работает синхронно
  window.LR_ASSETS.forEach(function (p) {
    waits.push(new Promise(function (ok) {
      var im = new Image();
      im.onload = function () { window.LRIMG[p] = im; ok(); };
      im.onerror = function () { ok(); };
      im.src = p;
    }));
  });
  // Текстовые ассеты (фразы сервочерепа): lrshim.Assets читает их синхронно
  window.LRTEXT = {};
  window.LR_TEXT.forEach(function (name) {
    waits.push(fetch('assets/' + name).then(function (r) { return r.text(); }).then(function (t) {
      window.LRTEXT[name] = t;
    }).catch(function () { }));
  });
  // Фото миниатюр лежат в IndexedDB (web/js/photos.js); старые из localStorage переезжают туда же.
  // Кадры грузим в LRIMG под путём photo:<ключ>
  waits.push(window.lrPhotos.loadAll());

  // Касания → подложка: 0 вниз, 1 движение, 2 вверх, 3 отмена, 4 колесо, 5 щипок (коэффициент в window.lrPinchF), 6 конец щипка
  var el = window.LRCANVAS, down = false, pts = {}, pinching = false, ignore = false, d0 = 1;
  function send(kind, e) {
    if (!window.lrPtr) return;
    var r = el.getBoundingClientRect();
    window.lrPtr(kind, e.clientX - r.left, e.clientY - r.top);
  }
  function pinch(kind, x, y, f) {
    if (!window.lrPtr) return;
    var r = el.getBoundingClientRect();
    window.lrPinchF = f;
    window.lrPtr(kind, x - r.left, y - r.top);
  }
  function two() {
    var k = Object.keys(pts), a = pts[k[0]], b = pts[k[1]];
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) };
  }
  el.addEventListener('pointerdown', function (e) {
    down = true;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(pts).length === 2) { pinching = true; d0 = two().d; return; }
    if (Object.keys(pts).length > 2 || ignore) return;
    send(0, e);
  });
  el.addEventListener('pointermove', function (e) {
    if (pts[e.pointerId]) pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pinching) {
      if (Object.keys(pts).length < 2) return;
      var t = two();
      pinch(5, t.x, t.y, t.d / d0);
      d0 = t.d;
      return;
    }
    if (!ignore) send(1, e);
  });
  el.addEventListener('wheel', function (e) {
    if (!window.lrPtr) return;
    e.preventDefault();
    if (e.ctrlKey) { pinch(5, e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01)); pinch(6, e.clientX, e.clientY, 1); return; }
    window.lrPtr(4, 0, e.deltaY);
  }, { passive: false });
  function end(kind, e) {
    delete pts[e.pointerId];
    var n = Object.keys(pts).length;
    if (pinching) {
      if (n < 2) { pinching = false; ignore = true; pinch(6, e.clientX, e.clientY, 1); send(2, e); }
    } else if (!ignore) {
      send(kind, e);
    }
    if (n === 0) { down = false; ignore = false; }
  }
  el.addEventListener('pointerup', function (e) { end(2, e); });
  el.addEventListener('pointercancel', function (e) { end(3, e); });

  function status(t) { var el = document.getElementById('boot'); if (el) el.textContent = t; }
  Promise.all(waits).then(function () {
    status('Каталоги BSData…');
    return window.lrLoadData();
  }).catch(function (e) {
    // без сети и без кеша — играем без каталогов (фракции пустые)
    status('Каталоги не загружены: ' + e.message);
    window.LRDATA = null;
  }).then(function () {
    var el = document.getElementById('boot');
    if (el) el.style.display = 'none';
    if (window.lrStart) window.lrStart();
  });
})();
// ?diag — замеры экрана поверх интерфейса: понять, почему что-то не так на конкретном телефоне
if (/[?&]diag/.test(location.search)) {
  (function () {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:8px;right:8px;top:64px;z-index:9;padding:8px;background:#000c;color:#7f7;font:13px monospace;white-space:pre-wrap;pointer-events:none;';
    document.body.appendChild(box);
    setInterval(function () {
      var c = window.LRCANVAS, v = window.visualViewport, r = c.getBoundingClientRect(), i = window.LRINSET;
      box.textContent = 'dpr ' + window.devicePixelRatio + '\ncanvas ' + c.width + 'x' + c.height + '\ncss ' + r.width + 'x' + r.height + ' top ' + r.top + ' scrollY ' + window.scrollY +
        '\ninner ' + window.innerWidth + 'x' + window.innerHeight + '\nvv ' + (v ? v.width + 'x' + v.height + ' scale ' + v.scale : '-') +
        '\ninset ' + i.top + ' ' + i.bottom + '\nstandalone ' + (window.navigator.standalone === true);
    }, 500);
  })();
}
</script>
</body>
</html>
